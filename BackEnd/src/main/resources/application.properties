# ============================================
# RompGPS Backend
# ============================================
#
# NINGÚN SECRETO TIENE VALOR POR DEFECTO.
#
# Antes se usaba el patrón ${VAR:valor-real}, que daba una falsa sensación de
# seguridad: si la variable de entorno no estaba definida, la aplicación
# arrancaba con el secreto que había commiteado en este archivo. Ahora, si falta
# un secreto, el arranque FALLA. Es el comportamiento correcto: es preferible no
# arrancar a arrancar sin seguridad.
#
# Para desarrollo local, copia .env.example a .env y rellena los valores.
# spring-dotenv (ya está en el pom) carga ese archivo automáticamente.
# ============================================

spring.application.name=rompgps-backend
server.port=${SERVER_PORT:8081}

# ============================================
# PostgreSQL - Usuarios
# ============================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${POSTGRES_DB:rompgps_users}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Desactivado a propósito: con open-in-view activo, Jackson materializa las
# colecciones LAZY durante la serialización y dispara un N+1 por cada elemento
# de un listado. Además oculta los errores de sesión hasta la capa de vista.
spring.jpa.open-in-view=false

# ============================================
# MongoDB - Datos GPS
# ============================================
spring.data.mongodb.uri=${MONGODB_URI}

# ============================================
# Redis - Caché
# ============================================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# ============================================
# JWT
# ============================================
# Sin valor por defecto: con el secreto anterior publicado en el repositorio,
# cualquiera podía firmar un token con rol:ADMIN.
jwt.secreto=${JWT_SECRET}
# Access token corto; la sesión se mantiene con el refresh token.
jwt.expiracion=${JWT_EXPIRACION:900000}
jwt.refresco-expiracion=${JWT_REFRESCO_EXPIRACION:604800000}

# ============================================
# OAuth2
# ============================================
google.client-id=${GOOGLE_CLIENT_ID}
github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}

# ============================================
# CORS
# ============================================
cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:5173,http://localhost:3000}

# ============================================
# Ingesta GPS
# ============================================
# Clave compartida con el Servidor-TCP. POST /gps la exige en la cabecera
# X-API-Key; antes el endpoint era público y cualquiera podía inyectar
# posiciones falsas para cualquier IMEI.
gps.ingesta.api-key=${GPS_INGESTA_API_KEY}

# ============================================
# Límite de intentos de autenticación
# ============================================
seguridad.rate-limit.intentos=${RATE_LIMIT_INTENTOS:5}
seguridad.rate-limit.ventana-segundos=${RATE_LIMIT_VENTANA:300}
seguridad.rate-limit.bloqueo-segundos=${RATE_LIMIT_BLOQUEO:900}

# ============================================
# Administrador inicial (opcional)
# ============================================
# Si no se definen, el arranque no falla: solo avisa de que no hay admin.
admin.usuario=${ADMIN_USUARIO:}
admin.contrasena=${ADMIN_CONTRASENA:}
admin.correo=${ADMIN_CORREO:admin@rompgps.local}

# ============================================
# Actuator
# ============================================
# Solo health e info por HTTP. /actuator/** exige rol ADMIN en SecurityConfig,
# salvo esos dos. Nunca exponer env, heapdump o mappings: filtrarían secretos.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================
# OpenAPI / Swagger
# ============================================
# Documentación navegable de la API. Antes no había ninguna.
# UI en /swagger-ui.html, esquema en /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SWAGGER_HABILITADO:true}

# Limite de peticiones para endpoints publicos (registro, OAuth, refresco).
# Mas holgado que el del login: aqui cada peticion es legitima y lo que se
# acota es el volumen, no los fallos.
seguridad.rate-limit.publico=${RATE_LIMIT_PUBLICO:20}
