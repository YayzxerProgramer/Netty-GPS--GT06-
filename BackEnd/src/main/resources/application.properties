# ============================================
# RompGPS Backend Configuration
# ============================================
spring.application.name=rompgps-backend
server.port=8081

# ============================================
# PostgreSQL - Usuarios (Autenticación)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/rompgps_users
spring.datasource.username=rompgps
spring.datasource.password=gps12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# ============================================
# MongoDB - Datos GPS
# ============================================
spring.data.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/Romp_Gps}
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/Romp_Gps}
spring.mongodb.database=Romp_Gps

# ============================================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
#============================================= CORS Configuration


