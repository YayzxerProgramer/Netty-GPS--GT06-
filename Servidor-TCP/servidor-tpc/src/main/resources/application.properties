# ============================================
# Servidor TCP - Receptor GT06
# ============================================
# Para desarrollo local: cp .env.example .env
# ============================================

spring.application.name=ServidorTPC

# Puerto HTTP de este módulo (diagnóstico). NO es el de los GPS.
server.port=${SERVER_PORT:8080}

# ============================================
# Servidor TCP de dispositivos
# ============================================
# Antes estaba escrito a mano dentro de ServerTcp.java.
gps.tcp.puerto=${GPS_TCP_PUERTO:9000}

# Cierra la conexión si un dispositivo no envía nada en este tiempo. Las
# conexiones GPRS mueren a menudo sin cerrar el socket y quedaban colgadas
# hasta el timeout del sistema operativo.
gps.tcp.inactividad-segundos=${GPS_TCP_INACTIVIDAD:300}

# ============================================
# BackEnd
# ============================================
# Esta propiedad ya existía pero no la usaba nadie: tanto GpsServerHandler como
# DataController tenían la URL escrita a mano.
backend.base-url=${BACKEND_BASE_URL:http://localhost:8081}

# Clave compartida con el BackEnd; viaja en la cabecera X-API-Key. Sin ella el
# backend rechaza la ingesta con 401. Debe coincidir con GPS_INGESTA_API_KEY
# de BackEnd/.env.
gps.ingesta.api-key=${GPS_INGESTA_API_KEY}

# ============================================
# Logging
# ============================================
logging.level.com.servidortpc=${LOG_NIVEL:INFO}
